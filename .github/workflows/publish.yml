name: Publish to npm

# Publishes @pmndrs/upscaler when a version tag (v*) is pushed. Merges to main
# never publish. To cut a release, run `npm run release` on an up-to-date main
# (docs/releasing.md): it computes the version from Conventional Commits, runs
# the gate, and creates the `release: vX.Y.Z` commit + annotated tag. Pushing
# that tag runs this workflow.
#
# Guards, each failing the run before anything is published:
#   - the tag is "v" + SemVer;
#   - package.json at the tagged commit has exactly that version;
#   - the tagged commit is on origin/main (a tag on a side branch never ships).
#
# Idempotent: a version already on npm is not republished, and the GitHub
# Release for the tag is created only if missing; an existing one is never
# edited. To re-run a tag (say the Release step failed after npm succeeded),
# use "Run workflow" with input `tag`. A dispatch takes the release scripts from
# the branch it runs on, so it can also repair tags cut before them.
#
# Stable versions publish to the `latest` dist-tag; prereleases to their first
# identifier (0.3.0-beta.1 → beta), numeric-only ones (0.3.0-0) to `next`.
# `npm publish` runs the package's prepublishOnly gate (lint/typecheck/test/
# build) first, so a broken tree can't ship.
#
# Auth is npm Trusted Publishing (OIDC): no token or secret, and provenance is
# attached automatically. The trusted publisher registered on npmjs.com names
# this file (org pmndrs, repo upscaler, workflow publish.yml), so keep the
# filename.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish or repair, e.g. v0.3.0
        required: true
        type: string

permissions:
  contents: write # gh release create
  id-token: write # OIDC trusted publishing + provenance

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # all tags + history, for the guards and the release notes
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      # Trusted Publishing needs npm >= 11.5.1; Node 22 bundles npm 10.x.
      # Pinned to a major, not @latest: npm 12 changed `npm pack --json`'s shape
      # and silently broke every release from 2026-07-29. Keep this spec
      # identical to ci.yml's so CI exercises the npm that publishes.
      - run: npm install -g npm@^11.5.1

      # The checkout is the workflow's own commit: the tag on a push, the chosen
      # branch on a dispatch. Copy its release scripts aside before switching to
      # the tag, so a dispatch can repair a tag whose tree predates them.
      - name: Stage release tooling
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/release-tools"
          cp scripts/release-notes.mjs scripts/release-version.mjs "$RUNNER_TEMP/release-tools/"

      - name: Verify release tag
        id: release
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSHED_REF: ${{ github.ref }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail

          case "$EVENT_NAME" in
            push)
              if [[ "$PUSHED_REF" != refs/tags/* ]]; then
                echo "::error::Publishing runs only for tag pushes, not $PUSHED_REF."
                exit 1
              fi
              TAG="${PUSHED_REF#refs/tags/}"
              ;;
            workflow_dispatch)
              TAG="$INPUT_TAG"
              ;;
            *)
              echo "::error::Unsupported event: $EVENT_NAME"
              exit 1
              ;;
          esac

          # Guard 1: "v" + SemVer. Also yields the version, its dist-tag, and
          # whether its Release should be "latest" (not when backfilling an old tag).
          if ! described=$(node "$RUNNER_TEMP/release-tools/release-version.mjs" --describe "$TAG"); then
            echo "::error::Tag $TAG is not a v-prefixed SemVer version."
            exit 1
          fi
          read -r VERSION PRERELEASE DIST_TAG LATEST <<< "$described"
          if [[ -z "$VERSION" || -z "$PRERELEASE" || -z "$DIST_TAG" || -z "$LATEST" ]]; then
            echo "::error::release-version.mjs --describe printed '$described'."
            exit 1
          fi

          if ! COMMIT=$(git rev-parse --verify --quiet "refs/tags/$TAG^{commit}"); then
            echo "::error::Tag $TAG does not exist."
            exit 1
          fi
          git checkout --quiet --detach "$COMMIT"

          # Guard 2: the tag names the version package.json declares at that commit.
          TAGGED_VERSION=$(
            git show "$COMMIT:package.json" |
              node -e 'let data = ""; process.stdin.setEncoding("utf8"); process.stdin.on("data", (chunk) => data += chunk); process.stdin.on("end", () => process.stdout.write(String(JSON.parse(data).version)));'
          )
          if [[ "$TAGGED_VERSION" != "$VERSION" ]]; then
            echo "::error::Tag $TAG names version '$VERSION' but package.json at $COMMIT has '$TAGGED_VERSION'."
            exit 1
          fi

          # Guard 3: only commits that reached main publish.
          git fetch --quiet --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$COMMIT" refs/remotes/origin/main; then
            echo "::error::Tag $TAG points at $COMMIT, which is not on origin/main."
            exit 1
          fi

          echo "Releasing $TAG ($COMMIT) to dist-tag '$DIST_TAG'."
          {
            echo "tag=$TAG"
            echo "version=$VERSION"
            echo "prerelease=$PRERELEASE"
            echo "dist_tag=$DIST_TAG"
            echo "latest=$LATEST"
          } >> "$GITHUB_OUTPUT"

      - name: Check npm for this version
        id: npm
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail

          NAME=$(node -p "require('./package.json').name")
          error_file=$(mktemp "$RUNNER_TEMP/npm-view.XXXXXX")
          set +e
          published_version=$(npm view "$NAME@$VERSION" version 2>"$error_file")
          result=$?
          set -e
          npm_error=$(<"$error_file")
          rm -f "$error_file"

          if [[ "$result" -eq 0 && "$published_version" == "$VERSION" ]]; then
            echo "$NAME@$VERSION is already on npm; skipping publish."
            echo "published=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          npm_code=$(
            printf '%s\n' "$npm_error" |
              awk '$1 == "npm" && ($2 == "error" || $2 == "ERR!") && $3 == "code" { gsub("\r", "", $4); print $4; exit }'
          )
          if [[ "$result" -ne 0 && "$npm_code" == "E404" ]]; then
            echo "published=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Anything else (auth, network, a registry error) must not be read as
          # "absent" and trigger a doomed or duplicate publish.
          echo "::error::Unable to determine whether $NAME@$VERSION exists on npm."
          printf '%s\n' "$npm_error" >&2
          exit 1

      - name: Install dependencies
        if: steps.npm.outputs.published == 'false'
        run: npm ci

      - name: Publish to npm
        if: steps.npm.outputs.published == 'false'
        env:
          VERSION: ${{ steps.release.outputs.version }}
          DIST_TAG: ${{ steps.release.outputs.dist_tag }}
        run: |
          set -euo pipefail
          echo "Publishing $VERSION under dist-tag '$DIST_TAG'"
          npm publish --access public --tag "$DIST_TAG"

      # --- Append-only GitHub Release ------------------------------------------
      - name: Generate GitHub Release notes
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          node "$RUNNER_TEMP/release-tools/release-notes.mjs" --tag "$TAG" > "$RUNNER_TEMP/release-notes.md"

      - name: Create GitHub Release
        env:
          VERSION: ${{ steps.release.outputs.version }}
          TAG: ${{ steps.release.outputs.tag }}
          PRERELEASE: ${{ steps.release.outputs.prerelease }}
          LATEST: ${{ steps.release.outputs.latest }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          if [[ -z "$VERSION" || "$TAG" != "v$VERSION" ]]; then
            echo "::error::Release tag does not match the verified version."
            exit 1
          fi
          if [[ ! "$REPOSITORY" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]; then
            echo "::error::Invalid GitHub repository identity."
            exit 1
          fi

          # Only an explicit 404 means "missing"; any other failure stops the run
          # rather than risk a duplicate or an edit.
          set +e
          response=$(gh api --include --method GET "repos/$REPOSITORY/releases/tags/$TAG" 2>&1)
          result=$?
          set -e
          status=$(
            printf '%s\n' "$response" |
              awk '/^HTTP\/[^ ]+ [0-9][0-9][0-9]/ { status=$2 } END { print status }'
          )

          if [[ "$result" -eq 0 && "$status" =~ ^2[0-9][0-9]$ ]]; then
            echo "GitHub Release $TAG already exists; leaving it unchanged."
            exit 0
          fi
          if [[ "$result" -eq 0 || "$status" != "404" ]]; then
            echo "::error::Unable to determine whether GitHub Release $TAG exists."
            printf '%s\n' "$response" >&2
            exit 1
          fi

          if [[ "$PRERELEASE" == "true" ]]; then
            release_flags=(--prerelease --latest=false)
          elif [[ "$PRERELEASE" == "false" && "$LATEST" == "true" ]]; then
            release_flags=(--latest)
          elif [[ "$PRERELEASE" == "false" && "$LATEST" == "false" ]]; then
            release_flags=(--latest=false)
          else
            echo "::error::Invalid prerelease classification."
            exit 1
          fi

          gh release create "$TAG" \
            --repo "$REPOSITORY" \
            --verify-tag \
            --title "$TAG" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            "${release_flags[@]}"
